name: Cost Janitor

on:
  pull_request:
  workflow_dispatch:

jobs:
  cost-scan:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,s3
        options: >-
          --health-cmd "curl -s http://localhost:4566/_localstack/health | grep -q '\"ec2\": \"available\"'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install boto3 terraform-local awscli

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack..."
          for i in {1..30}; do
            if curl -s http://localhost:4566/_localstack/health | grep -q "running"; then
              echo "LocalStack is ready!"
              break
            fi
            echo "Attempt $i — waiting..."
            sleep 5
          done

      - name: Terraform Init & Apply
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          tflocal init
          tflocal validate
          tflocal apply -auto-approve

      - name: Run Cost Janitor (dry-run)
        id: janitor
        working-directory: janitor
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python3 janitor.py --dry-run --endpoint-url http://localhost:4566
        continue-on-error: true

      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janitor-report
          path: |
            janitor/report.json
            janitor/report.md

      - name: Post PR Comment if Orphans Found
        if: steps.janitor.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'janitor/report.md';
            if (fs.existsSync(path)) {
              const body = fs.readFileSync(path, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Fail if orphans found
        if: steps.janitor.outcome == 'failure'
        run: |
          echo " Orphaned resources found! Check the report artifact."
          exit 1